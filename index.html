<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday, Senior Developer!</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --success-color: #2ea44f;
            --error-color: #f85149;
        }
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        h1 {
            color: var(--accent-color);
            text-align: center;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .riddle {
            font-size: 15px;
            line-height: 1.6;
            background: #090d13;
            padding: 18px;
            border-left: 4px solid var(--accent-color);
            margin-bottom: 15px;
            white-space: pre-wrap;
        }
        .code-block {
            background: #1f242c;
            padding: 10px;
            border-radius: 4px;
            font-family: monospace;
            color: #ff7b72;
            display: block;
            margin: 10px 0;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #090d13;
            border: 1px solid #30363d;
            color: #fff;
            font-family: inherit;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background-color: var(--success-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #2c974b; }
        .feedback { margin-top: 10px; font-weight: bold; text-align: center; min-height: 20px; }
        .feedback.error { color: var(--error-color); }
        .feedback.success { color: var(--success-color); }
        .progress { text-align: right; font-size: 14px; color: #8b949e; margin-bottom: 10px; }
        .prize-box { display: none; text-align: center; }
        .prize-title { color: #ff7b72; font-size: 28px; margin-bottom: 15px; }
        .prize-content { background: #21262d; border: 2px dashed #58a6ff; padding: 25px; border-radius: 6px; margin-top: 20px; font-size: 18px; }
        .secret-word {
            display: inline-block;
            font-size: 26px;
            color: #79c0ff;
            background: #090d13;
            padding: 10px 20px;
            border: 1px solid #30363d;
            border-radius: 4px;
            margin: 15px 0;
            letter-spacing: 2px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <div id="game-zone">
        <h1>Production_Ready_Quest.exe</h1>
        <div class="progress" id="progress-text">Загадка: 1 из 3</div>
        <div class="quest-box">
            <div class="riddle" id="riddle-text"></div>
            <input type="text" id="answer-input" placeholder="Введите ваш ответ..." autocomplete="off">
            <button onclick="checkAnswer()">Закоммитить решение</button>
            <div id="feedback" class="feedback"></div>
        </div>
    </div>

    <div id="prize-zone" class="prize-box">
        <h1 class="prize-title">🎉 С Днём Рождения! 🎉</h1>
        <p>Архитектура идеальна, тесты пройдены, багов не обнаружено!</p>
        <div class="prize-content">
            <p>Чтобы забрать свой заслуженный приз, напиши или скажи мне кодовое слово:</p>
            <div class="secret-word">Бурмалда</div>
            <p style="font-size: 14px; color: #8b949e; margin-top: 15px;">(После получения кодового слова я вручу твой подарок! 🎁)</p>
        </div>
    </div>
</div>

<script>
    const quests = [
        {
            riddle: "Загадка #1: Логика и структуры данных.\n\nУ вас есть стек (Stack) с ограничением по памяти, работающий по принципу LIFO. Вам необходимо реализовать на его основе полноценную очередь (Queue), работающую по принципу FIFO.\n\nКакое минимальное количество стеков вам ОГРАНИЧЕННО необходимо использовать для полной и корректной эмуляции одной очереди?",
            answers: ["2", "два", "two"]
        },
        {
            riddle: "Загадка #2: Нюансы компиляции.\n\nПеред вами классическое выражение на C-подобных языках:\n<span class='code-block'>int x = 5;\nx = x++;</span>\nЧему будет равен `x` после выполнения этого выражения в большинстве стандартных сред выполнения (из-за особенностей постфиксного инкремента и порядка вычислений)?",
            answers: ["5", "пять", "five"]
        },
        {
            riddle: "Загадка #3: Алгоритмический парадокс.\n\nЭтот тип обхода бинарного дерева гарантированно возвращает элементы строго в отсортированном по возрастанию порядке, если само дерево является сбалансированным бинарным деревом поиска (BST).\n\nНазовите этот тип обхода (латиницей или на русском).",
            answers: ["inorder", "in-order", "центрированный", "симметричный", "in order", "центрированный обход", "симметричный обход"]
        }
    ];

    let currentStep = 0;
    const riddleTextEl = document.getElementById('riddle-text');
    const answerInputEl = document.getElementById('answer-input');
    const feedbackEl = document.getElementById('feedback');
    const progressTextEl = document.getElementById('progress-text');
    const gameZoneEl = document.getElementById('game-zone');
    const prizeZoneEl = document.getElementById('prize-zone');

    function loadQuest() {
        if (currentStep < quests.length) {
            progressTextEl.innerText = `Загадка: ${currentStep + 1} из ${quests.length}`;
            riddleTextEl.innerHTML = quests[currentStep].riddle;
            answerInputEl.value = "";
            feedbackEl.innerText = "";
        } else {
            gameZoneEl.style.display = "none";
            prizeZoneEl.style.display = "block";
        }
    }

    function checkAnswer() {
        const userAnswer = answerInputEl.value.trim().toLowerCase();
        const validAnswers = quests[currentStep].answers;

        if (userAnswer === "") return;

        if (validAnswers.includes(userAnswer)) {
            feedbackEl.innerText = "Status 200: OK! Тест успешно пройден.";
            feedbackEl.className = "feedback success";
            currentStep++;
            setTimeout(loadQuest, 1200);
        } else {
            feedbackEl.innerText = "Assertion Failed: Неверный ответ. Попробуй изменить логику.";
            feedbackEl.className = "feedback error";
        }
    }

    answerInputEl.addEventListener("keyup", function(e) { if (e.key === "Enter") checkAnswer(); });
    loadQuest();
</script>

</body>
</html>
